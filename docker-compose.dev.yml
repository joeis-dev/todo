services:
  db:
    container_name: todo_db_dev
    ports:
      - "5432:5432"

  backend:
    container_name: todo_backend_dev
    build:
      target: dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app

  frontend:
    container_name: todo_frontend_dev
    build:
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
