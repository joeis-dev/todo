name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**', 'fix/**', 'hotfix/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and Test Backend
        env:
          JWT_SECRET: dev_secret_very_long_string_for_testing_123456
          JWT_EXPIRATION: 86400000
          DB_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
          DB_USERNAME: sa
          DB_PASSWORD: 
        run: |
          cd backend
          mvn clean test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install and Test Frontend
        run: |
          cd frontend
          # npm install (Assuming lock file exists in real repo)
          # npm test

  build-and-push:
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Build and Push Backend Image
        run: |
          docker build -t todo-backend ./backend
          # docker tag todo-backend:latest ${{ vars.ECR_REPOSITORY_URL }}/todo-backend:latest
          # docker push ${{ vars.ECR_REPOSITORY_URL }}/todo-backend:latest

      - name: Build and Push Frontend Image
        run: |
          docker build -t todo-frontend ./frontend
          # docker tag todo-frontend:latest ${{ vars.ECR_REPOSITORY_URL }}/todo-frontend:latest
          # docker push ${{ vars.ECR_REPOSITORY_URL }}/todo-frontend:latest
